services:
  # SERVICE A: THE BRAIN (Ollama LLM Engine)
  ollama-service:
    image: ollama/ollama:latest
    container_name: argus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    # Enable GPU support (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - argus-net

  # SERVICE B: KALI-CORE (Security Toolset Runtime)
  kali-core:
    build:
      context: .
      dockerfile: docker/kali-core/Dockerfile
    container_name: argus-kali-core
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SERVICE C: THE STUDIO (Python App)
  argus-app:
    build: .
    container_name: argus-studio
    depends_on:
      - ollama-service
      - kali-core
    ports:
      - "12189:12189"
    environment:
      - OLLAMA_HOST=http://ollama-service:11434
      - WSL_HOST=kali-core
      - WSL_USER=kali
      - WSL_PASS=kali
      - WSL_PORT=22
    volumes:
      - ./reports:/app/reports
    networks:
      - argus-net

networks:
  argus-net:
    driver: bridge
