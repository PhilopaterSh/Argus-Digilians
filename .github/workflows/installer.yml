name: Argus Installer Tests

on:
  push:
    branches: [ "main", "master", "fix/*", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  pester-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Pester tests
      shell: pwsh
      run: |
        $result = Invoke-Pester -Path .\tests\pester\install_tests.tests.ps1 -PassThru
        if ($result.FailedCount -gt 0) {
            Write-Error "Pester tests failed with $($result.FailedCount) failure(s)."
            exit 1
        }
