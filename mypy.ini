# Mypy type-check configuration (specs/012-spec-reconciliation section 7, stage 2).
# Lenient globally (the legacy codebase is largely untyped and uses untyped
# third-party libs); strict only for newly authored, fully typed modules. CI runs
# mypy against the typed modules to keep the gate meaningful and green.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
warn_redundant_casts = True
exclude = (Argus_venv|node_modules|archive|__pycache__)

[mypy-app.core.rag.manifest]
disallow_untyped_defs = True
disallow_incomplete_defs = True
