[pytest]
# Test configuration for Argus (specs/012-spec-reconciliation section 6 - Testing Strategy).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: fast tests with mocked boundaries, no external services (run in CI as a blocking gate)
    integration: requires real Ollama + ephemeral SQLite + FAISS
    e2e: full end-to-end smoke against a controlled local target
    eval: AI-evaluation (retrieval recall@k / faithfulness; agent bounded-loop termination)
    regression: locks a previously fixed defect
